name: Sync with upstream

# Keeps this fork merged with gorhill/uBlock, and cuts an MV3 release whenever
# upstream publishes a new tag.
#
# The MV3 port is designed so that this can run unattended: it adds files and
# modifies none, so a merge from upstream cannot conflict. Should one ever
# happen anyway, this workflow aborts the merge and opens an issue rather than
# forcing anything.
#
# Nothing is pushed until the merged tree has actually been built and verified.
# "Merges cleanly" and "still builds" are different properties, and only the
# second one is worth publishing.

on:
  schedule:
    # Deliberately off the hour: scheduled runs at :00 are heavily contended and
    # get delayed.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to release (default: newest unreleased)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/gorhill/uBlock.git

  # `gh` infers the target repository from git remotes, and its resolution order
  # puts a remote named `upstream` AHEAD of `origin`. The "Fetch upstream" step
  # below adds exactly such a remote, so without this pin every subsequent `gh`
  # call silently targets gorhill/uBlock instead of this fork.
  #
  # That is not hypothetical: run 33610413837 pushed a tag and then died with
  # `HTTP 404: workflow release.yml not found on the default branch
  # (.../repos/gorhill/uBlock/actions/workflows/release.yml)`. The conflict
  # reporter below has the same exposure, and would have tried to file its issue
  # on gorhill/uBlock.
  GH_REPO: ${{ github.repository }}

  # Which upstream tags are releases. Excludes `npm_*` (one dead tag from 2021)
  # and anything else non-version-shaped. Betas and rcs are included on purpose:
  # upstream ships roughly six betas per stable release, and this fork tracks
  # them. A four-component dist/version makes those build as "uBlock Origin
  # development build" against the dev filter-list channel, which is upstream's
  # own intent for a beta tag.
  TAG_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+((b|rc)[0-9]+)?$'

jobs:
  sync:
    name: Merge upstream, verify, tag
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the merge commit and the release tag
      issues: write     # report a merge conflict or a broken merge
      actions: write    # dispatch release.yml when no PAT is configured
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          # A PAT here (secrets.SYNC_TOKEN) makes the tag push trigger
          # release.yml directly. Without one we fall back to an explicit
          # workflow dispatch further down, because pushes authenticated with
          # GITHUB_TOKEN deliberately do not trigger workflows.
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Configure git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Detect release-token setup
        id: pat
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo 'has=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Assert upstream's release workflow stays disabled
        # main.yml fires on ANY tag creation and would race release.yml for
        # `gh release create` on the same tag. The nastier outcome is the quiet
        # one: if main.yml wins, release.yml's `gh release create || gh release
        # edit` fallback succeeds, the run goes green, and the release stays a
        # DRAFT -- so the CRX URL baked into update.xml 404s for Chrome.
        #
        # It is disabled as a repository setting rather than by editing the file,
        # to keep the merge-conflict surface at zero. Nothing re-asserts that
        # after a repo transfer or a settings change, so do it here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh api "repos/${GH_REPO}/actions/workflows/main.yml" --jq .state 2>/dev/null || echo missing)
          echo "main.yml state: $state"
          case "$state" in
            disabled_manually|missing) ;;
            *)
              echo "::warning::upstream's main.yml is '$state'; disabling it to avoid racing release.yml"
              gh workflow disable main.yml || \
                echo "::error::could not disable main.yml -- a tag push may produce a draft release whose CRX URL 404s"
              ;;
          esac

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM"
          git fetch --no-tags upstream master
          # Park upstream tags outside refs/tags so they can never collide with,
          # or be mistaken for, our own release tags. --no-tags additionally
          # stops git from auto-following tags into refs/tags.
          git fetch --no-tags --prune upstream '+refs/tags/*:refs/upstream-tags/*'

      - name: Merge upstream/master
        id: merge
        run: |
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if git merge --no-edit upstream/master; then
            after=$(git rev-parse HEAD)
            echo "merged=$after" >> "$GITHUB_OUTPUT"
            if [ "$before" = "$after" ]; then
              echo 'Already up to date.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
            else
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo 'Merge conflict.'
          git merge --abort || true
          echo 'conflict=true' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Upstream sync needs manual attention'
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body=$(printf '%s\n' \
            "Merging \`upstream/master\` into \`master\` produced a conflict, so the sync was aborted and nothing was pushed." \
            '' \
            "Run: $RUN_URL" \
            '' \
            'To resolve locally:' \
            '```sh' \
            'git fetch upstream master' \
            'git merge upstream/master' \
            '# resolve, then:' \
            'git push origin master' \
            '```' \
            '' \
            'The MV3 port adds files and modifies none, so a conflict here is unexpected. The likely cause is that upstream moved or renamed a file the port builds on -- check `tools/make-chromium-mv3.sh`, `tools/make-chromium-mv3-meta.py` and `tools/patch-mv3-modules.mjs` against the current layout.')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Check the merge is pushable
        id: pushable
        if: steps.merge.outputs.changed == 'true'
        # GitHub refuses any push from a GitHub App that creates or updates a
        # file under .github/workflows/, and GITHUB_TOKEN *is* an App
        # installation token. `workflows` is not one of the keys a workflow's
        # `permissions:` block can request, so nothing configured here can grant
        # it -- only a token carrying the `workflow` scope can push such a
        # change.
        #
        # This is a matter of when, not if: upstream edits
        # .github/workflows/main.yml regularly (79a59e13 on 2026-08-14, then
        # 89e149e7 and a2fb47c4 both on 2026-08-21). Detect it before spending
        # ten minutes on two builds, and say exactly what to do about it.
        env:
          HAS_PAT: ${{ steps.pat.outputs.has }}
          BEFORE: ${{ steps.merge.outputs.before }}
        run: |
          touched=$(git diff --name-only "$BEFORE" HEAD -- .github/workflows/)
          if [ -z "$touched" ]; then
            echo 'Merge touches no workflow file; GITHUB_TOKEN can push it.'
            exit 0
          fi
          echo "Merge updates workflow file(s):"
          echo "$touched" | sed 's/^/  /'
          if [ "$HAS_PAT" = 'true' ]; then
            echo 'SYNC_TOKEN is configured, so the push can carry these.'
            exit 0
          fi
          echo 'blocked=true' >> "$GITHUB_OUTPUT"
          echo "::error::this merge updates $(echo "$touched" | wc -l) workflow file(s) and no SYNC_TOKEN is configured, so the push would be rejected. Add a SYNC_TOKEN secret with the \`workflow\` scope -- see docs/mv3-deployment.md"
          exit 1

      - name: Clone uAssets
        run: bash tools/pull-assets.sh

      # Gate the master push on the merged tree actually building. A merge can
      # be conflict-free and still break the port -- upstream renaming a file the
      # shims stand in front of, adding a manifest key the generator does not
      # know, or adding a dynamic import() the patcher does not reach.
      - name: Build and verify the merged tree
        id: verify_master
        run: bash tools/make-chromium-mv3.sh

      - name: Report broken build
        # Covers both build gates: the merged master tree, and the release tree
        # (upstream at the tag + the port's files). The second can fail on its
        # own -- the tag is a different upstream commit than master's tip, so a
        # drift assumption can hold for one and not the other -- and until this
        # step covered it, that failure filed no issue at all and the catch-all
        # below deliberately skipped it.
        if: |
          failure()
          && ( steps.verify_master.outcome == 'failure'
            || steps.verify_release.outcome == 'failure' )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHICH: ${{ steps.verify_master.outcome == 'failure' && 'master' || 'release' }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          if [ "$WHICH" = 'master' ]; then
            title='Upstream merge builds no longer'
            what="\`upstream/master\` merged cleanly but the resulting tree does not build, so **nothing was pushed and no tag was created**."
            repro=$(printf '%s\n' \
              '```sh' \
              'git fetch upstream master && git merge upstream/master' \
              'bash tools/pull-assets.sh' \
              'bash tools/make-chromium-mv3.sh' \
              '```')
          else
            title="Release tree for $TAG does not build"
            what="Master was merged and pushed, but the release tree for upstream tag \`$TAG\` -- upstream at that tag plus this fork's files -- does not build, so **no tag was created**. Master is fine; this tag is not."
            repro=$(printf '%s\n' \
              '```sh' \
              'git fetch upstream master '"'"'+refs/tags/*:refs/upstream-tags/*'"'"'' \
              "git checkout --detach refs/upstream-tags/$TAG" \
              'git checkout master -- $(git diff --name-only --diff-filter=A upstream/master master)' \
              'bash tools/pull-assets.sh' \
              'bash tools/make-chromium-mv3.sh' \
              '```')
          fi
          body=$(printf '%s\n' \
            "$what" \
            '' \
            "Run: $RUN_URL" \
            '' \
            'The failing step is `tools/verify-mv3-package.mjs`, whose output names the specific assumption that broke and how to fix it. Common causes:' \
            '' \
            '- upstream changed the `<title>` of `src/background.html` (breaks `src/js/i18n.js` background detection, and the service worker dies during evaluation)' \
            '- upstream added a `<script>` to `src/background.html` that `sw.js` does not import' \
            '- upstream added a manifest key `tools/make-chromium-mv3-meta.py` does not transform' \
            '- upstream added a dynamic `import()` that `tools/patch-mv3-modules.mjs` did not rewrite' \
            '- upstream reshaped something the scriptlet marker depends on (`vAPI.scriptletsInjector`, `self.uBO_scriptletsInjected`, the `contentscript` message channel)' \
            '' \
            'Reproduce locally:' \
            "$repro")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Push merge
        id: push
        if: steps.merge.outputs.changed == 'true'
        # Explicit source ref: later steps move HEAD to a detached release tree.
        run: git push origin "${{ steps.merge.outputs.merged }}:refs/heads/master"

      - name: Select upstream tag
        id: upstream
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Explicit dispatch: release whatever was asked for, released or not,
            # so a botched release can be redone.
            if git rev-parse -q --verify "refs/upstream-tags/$INPUT_TAG" >/dev/null; then
              echo "Dispatched tag: $INPUT_TAG"
              echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
              echo 'release=true' >> "$GITHUB_OUTPUT"
              # actions/checkout with fetch-depth 0 fetches tags too, so an
              # already-released tag is present locally and a plain `git tag`
              # would abort. Flag the redo so "Tag release" moves it instead.
              if git rev-parse -q --verify "refs/tags/$INPUT_TAG-mv3" >/dev/null; then
                echo "$INPUT_TAG-mv3 already exists; this run will MOVE it."
                echo 'redo=true' >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::error::no such upstream tag: $INPUT_TAG"
              exit 1
            fi
            exit 0
          fi

          # Only ever the single newest release-shaped tag. Considering the whole
          # backlog would mean treating all ~1100 historical upstream tags as
          # pending releases on the first run; this fork exists to track upstream
          # going forward, not to backfill its history.
          recent=$(git for-each-ref --sort=-creatordate \
                     --format='%(refname:strip=2)' refs/upstream-tags/ \
                   | grep -E "$TAG_PATTERN" | head -n 5)
          newest=$(echo "$recent" | head -n 1)
          echo "5 newest release-shaped upstream tags:"
          echo "$recent" | sed 's/^/  /'

          if [ -z "$newest" ]; then
            echo '::warning::no upstream tag matches TAG_PATTERN -- has upstream changed its tagging convention?'
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$newest-mv3" >/dev/null; then
            echo "Newest upstream tag $newest is already released as $newest-mv3; nothing to do."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If tags arrived in a burst, only the newest is picked up. Name the
          # others rather than letting them vanish silently -- bounded to the
          # recent window so this stays readable.
          skipped=''
          for t in $(echo "$recent" | tail -n +2); do
            git rev-parse -q --verify "refs/tags/$t-mv3" >/dev/null && continue
            skipped="$skipped $t"
          done
          if [ -n "$skipped" ]; then
            echo "::warning::releasing $newest only; also unreleased in the recent window:$skipped (dispatch this workflow with tag=<name> to release one)"
          fi

          echo "Releasing: $newest"
          echo "tag=$newest" >> "$GITHUB_OUTPUT"
          echo 'release=true' >> "$GITHUB_OUTPUT"

      # Build the tree we will actually ship: upstream AT THE TAG, plus this
      # fork's added files. Tagging the merge commit instead (what this workflow
      # used to do) ships upstream master's tip under a tag name it does not
      # correspond to, and takes its version from whatever dist/version master
      # happened to hold -- which also decides "development build" branding and
      # which asset channel `tools/make-assets.sh` selects.
      #
      # Because the port adds files and modifies none, this overlay is
      # conflict-free by construction and dist/version is upstream's own value
      # for that tag.
      - name: Construct the release tree
        if: steps.upstream.outputs.release == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A upstream/master "$MERGED")
          if [ "${#added[@]}" -eq 0 ]; then
            echo '::error::this fork appears to add no files to upstream; refusing to construct a release tree'
            exit 1
          fi
          # Only ADDED files are carried over, so the "adds files, modifies none"
          # invariant is not a description of this port -- it is a precondition of
          # this step. If it ever stops holding, the release tree would quietly
          # ship upstream's version of the changed file and the modification would
          # be absent from every release, while master looked correct. Assert it
          # instead of trusting it.
          mapfile -t altered < <(git diff --name-only --diff-filter=MDRT upstream/master "$MERGED")
          if [ "${#altered[@]}" -ne 0 ]; then
            printf 'altered upstream file: %s\n' "${altered[@]}"
            echo "::error::this fork modifies, deletes or renames ${#altered[@]} upstream file(s) (listed above), which the release tree would silently discard. Either revert the change and reimplement it additively, or teach this step to carry it."
            exit 1
          fi
          printf 'port file: %s\n' "${added[@]}"
          git checkout --detach "refs/upstream-tags/$TAG"
          git checkout "$MERGED" -- "${added[@]}"
          git commit -m "Chromium MV3 build of uBlock Origin $TAG

          Upstream $TAG with this fork's MV3 port applied. Generated by
          .github/workflows/sync-upstream.yml; do not commit to this ref."
          echo "dist/version at $TAG: $(cat dist/version)"

      - name: Build and verify the release tree
        id: verify_release
        if: steps.upstream.outputs.release == 'true'
        run: bash tools/make-chromium-mv3.sh

      - name: Tag release
        if: steps.upstream.outputs.release == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          REDO: ${{ steps.upstream.outputs.redo }}
        run: |
          if [ "$REDO" = 'true' ]; then
            # Only reachable from an explicit workflow_dispatch naming a tag that
            # is already released -- a deliberate human "redo this release".
            # A scheduled run can never get here, because it skips any tag that
            # already has a -mv3 counterpart.
            echo "::warning::moving the published tag $TAG-mv3 to a rebuilt tree"
            git tag -f "$TAG-mv3"
            git push --force origin "refs/tags/$TAG-mv3"
          else
            git tag "$TAG-mv3"
            git push origin "refs/tags/$TAG-mv3"
          fi

      - name: Trigger release build
        # Only needed without a PAT: a GITHUB_TOKEN push does not fire the tag
        # trigger in release.yml, so dispatch it explicitly instead.
        if: steps.upstream.outputs.release == 'true' && steps.pat.outputs.has != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          # GH_REPO (workflow env) keeps this on the fork; the `upstream` remote
          # added above would otherwise win gh's repository resolution.
          gh workflow run release.yml -f tag="$TAG-mv3"

      - name: Report any other failure
        # Catch-all, so no failure mode is silent. The two specific reporters
        # above cover a merge conflict and a merge that no longer builds;
        # everything else -- a rejected push, a tag that would not move, a failed
        # dispatch -- used to fail with no issue filed at all, and because master
        # never advanced, every following 04:17 run reproduced it identically.
        #
        # The body is assembled from what actually happened rather than assumed,
        # and in particular asks the REMOTE whether the tag exists: advising
        # someone to delete a published tag whose assets are the codebase URL in
        # the live update.xml would be worse than saying nothing.
        if: |
          failure()
          && steps.merge.outputs.conflict != 'true'
          && steps.verify_master.outcome != 'failure'
          && steps.verify_release.outcome != 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ steps.upstream.outputs.tag }}
          BLOCKED: ${{ steps.pushable.outputs.blocked }}
          PUSHED: ${{ steps.push.outcome }}
        run: |
          title='Upstream sync failed'
          {
            echo "The scheduled sync failed after merging cleanly. **Master may not have advanced, so this will repeat every day until it is fixed.**"
            echo
            echo "Run: $RUN_URL"
            echo
            if [ "$BLOCKED" = 'true' ]; then
              echo '### Cause: the merge cannot be pushed'
              echo
              echo 'The merge updates a file under `.github/workflows/`, and GitHub rejects any push from a GitHub App -- which is what `GITHUB_TOKEN` is -- that creates or updates a workflow file. `workflows` is not a permission a workflow can request, so this cannot be fixed in the workflow file.'
              echo
              echo 'Fix: add a `SYNC_TOKEN` secret whose token carries the `workflow` scope (classic PAT: `repo` + `workflow`; fine-grained PAT or App: Contents write + Workflows write). See `docs/mv3-deployment.md`.'
              echo
              echo 'Or land the merge by hand once:'
              echo '```sh'
              echo 'git fetch upstream master && git merge upstream/master && git push origin master'
              echo '```'
            elif [ "$PUSHED" = 'failure' ]; then
              echo '### Cause: pushing master failed'
              echo
              echo 'The merged tree built and verified, but the push was rejected. If the rejection mentions `.github/workflows/`, see the `SYNC_TOKEN` note in `docs/mv3-deployment.md`.'
            else
              echo '### Cause: tagging or dispatching the release failed'
              echo
              if [ -n "$TAG" ]; then
                if git ls-remote --exit-code --tags origin "refs/tags/$TAG-mv3" >/dev/null 2>&1; then
                  echo "The tag \`$TAG-mv3\` **is** on the remote, but no release build ran for it."
                  echo
                  echo 'This is self-latching: scheduled runs treat an existing tag as already released and skip it, so the sync will report success while doing nothing. Build it explicitly:'
                  echo '```sh'
                  echo "gh workflow run release.yml -R $GH_REPO -f tag=$TAG-mv3"
                  echo '```'
                else
                  echo "The tag \`$TAG-mv3\` is **not** on the remote, so nothing is stuck -- the next scheduled run will retry this tag on its own."
                fi
              fi
            fi
          } > body.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
